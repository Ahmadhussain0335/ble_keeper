name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-and-android:
    name: Dart + Android (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Newest tested release and the minimum in pubspec.yaml.
        flutter: ["3.47.7", "3.44.0"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - name: Format
        if: matrix.flutter == '3.47.7'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Dart tests
        run: flutter test
      - name: Example tests
        working-directory: example
        run: flutter test
      - name: Build example APK (debug and release)
        working-directory: example
        run: |
          flutter build apk --debug
          flutter build apk --release
      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :ble_keeper:testDebugUnitTest
      - name: Publish dry run
        if: matrix.flutter == '3.47.7'
        run: flutter pub publish --dry-run

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Build example (Swift Package Manager)
        working-directory: example
        run: flutter build ios --no-codesign --debug
      - name: Swift unit tests (XCTest)
        working-directory: example
        run: |
          flutter build ios --simulator --debug
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -destination "id=$udid"
