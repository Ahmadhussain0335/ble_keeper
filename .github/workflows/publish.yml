# Publishes to pub.dev when a version tag is pushed, using OIDC (no stored
# token). The reusable workflow installs both Dart (for the OIDC token) and
# Flutter (to resolve a Flutter plugin), runs a dry run, then publishes.
#
# Setup (once): on pub.dev > Admin > Automated publishing, enable GitHub
# Actions for this repository with tag pattern v{{version}} and require the
# GitHub environment "pub.dev"; create that environment in the repository
# settings (optionally with required reviewers).
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
