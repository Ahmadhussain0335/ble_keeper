name: ble_keeper
description: >-
  Keeps a BLE peripheral connected in the background, after the app is killed
  and after a reboot, on Android and iOS, and reports when the OS blocks it.
version: 0.1.0-beta.1
repository: https://github.com/Ahmadhussain0335/ble_keeper
issue_tracker: https://github.com/Ahmadhussain0335/ble_keeper/issues
topics:
  - bluetooth
  - ble
  - background
  - iot

screenshots:
  - description: Example app on Android keeping a BLE test peripheral connected (address hidden).
    path: doc/screenshot.png

environment:
  sdk: ^3.12.0
  # 3.44 is the first release whose Gradle plugin compiles plugins that rely
  # on built-in Kotlin when the app disables it.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Imported by the Pigeon-generated lib/src/messages.g.dart.
  meta: ^1.18.0
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  pigeon: ^29.0.8

flutter:
  plugin:
    platforms:
      android:
        package: com.ahmadhussain.ble_keeper
        pluginClass: BleKeeperPlugin
      ios:
        pluginClass: BleKeeperPlugin
